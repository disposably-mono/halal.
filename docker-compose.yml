services:
  db:
    image: postgres:16-alpine
    container_name: halal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-halal}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-halal_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - halal_pgdata:/var/lib/postgresql/data

volumes:
  halal_pgdata:
